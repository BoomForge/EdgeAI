name: EdgeAI Editor

on:
  schedule:
    - cron: '13,33,53 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Editor mode
        required: true
        default: check
        type: choice
        options:
          - check
          - auto
          - bootstrap
          - live
          - visual
          - image-repair
  push:
    branches:
      - main
    paths:
      - EDGEAI.md
      - bootstrap_config.json
      - requirements.txt
      - edgeai.py
      - edgeai_editor.py
      - image_repair.py
      - story_art.py
      - theme/**
      - .github/workflows/editor.yml

permissions:
  contents: write

concurrency:
  group: edgeai-editor
  cancel-in-progress: false

jobs:
  editor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
      BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.5-flash-lite

    steps:
      - name: Check out EdgeAI
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Validate newsroom theme
        run: python theme/validate_theme.py

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Select mode
        id: mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "value=auto" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "push" && "${{ contains(github.event.head_commit.message, '[image-repair]') }}" == "true" ]]; then
            echo "value=image-repair" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "push" && "${{ contains(github.event.head_commit.message, '[visual-backfill]') }}" == "true" ]]; then
            echo "value=visual" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "push" && "${{ contains(github.event.head_commit.message, '[launch]') }}" == "true" ]]; then
            echo "value=bootstrap" >> "$GITHUB_OUTPUT"
          else
            echo "value=check" >> "$GITHUB_OUTPUT"
          fi

      - name: Run central editor
        if: steps.mode.outputs.value != 'image-repair'
        run: python edgeai_editor.py --mode "${{ steps.mode.outputs.value }}"

      - name: Prepare live article image assets
        if: steps.mode.outputs.value == 'image-repair'
        run: python image_repair.py --prepare-only

      - name: Save editor state and mirrored imagery
        if: steps.mode.outputs.value != 'check'
        shell: bash
        run: |
          mkdir -p assets/story-art assets/source-media
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor_state.json assets/story-art assets/source-media
          if [[ -f image_repair_report.json ]]; then git add image_repair_report.json; fi
          if git diff --cached --quiet; then
            echo "No editor state or story artwork changes to save."
          else
            git commit -m "edgeai: persist editor imagery [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $attempt failed; retrying."
              sleep $((attempt * 2))
            done
          fi

      - name: Reconcile Blogger images after assets are public
        if: steps.mode.outputs.value != 'check'
        shell: bash
        run: |
          if [[ "${{ steps.mode.outputs.value }}" == "image-repair" ]]; then
            repair_args=""
          else
            repair_args="--pending-only"
          fi

          for attempt in 1 2 3 4 5; do
            echo "Image reconciliation attempt $attempt/5"
            if python image_repair.py $repair_args; then
              exit 0
            fi
            if [[ "$attempt" -eq 5 ]]; then
              echo "Article images are still not publicly reachable after retries. Failing loudly instead of silently accepting broken imagery."
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: Save image verification state
        if: steps.mode.outputs.value != 'check' && success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor_state.json image_repair_report.json
          if git diff --cached --quiet; then
            echo "No image verification state changes to save."
            exit 0
          fi
          git commit -m "edgeai: persist image verification [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Verification state push attempt $attempt failed; retrying."
            sleep $((attempt * 2))
          done
          exit 1
