name: Repair EdgeAI Blogger Widget

on:
  push:
    branches:
      - main
    paths:
      - theme/repair_blogger_widget.py

permissions:
  contents: write

concurrency:
  group: edgeai-theme-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out EdgeAI
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Repair Blogger widget declaration
        run: python theme/repair_blogger_widget.py

      - name: Validate theme
        run: python theme/validate_theme.py

      - name: Commit repaired theme
        shell: bash
        run: |
          if git diff --quiet -- theme/EDGEAI_THEME.xml; then
            echo "Theme already repaired."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add theme/EDGEAI_THEME.xml
          git commit -m "theme: use Blogger-compatible Blog1 declaration [skip ci]"
          git pull --rebase origin main
          git push
