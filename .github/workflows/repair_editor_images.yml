name: Repair EdgeAI Editor Images

on:
  push:
    branches:
      - main
    paths:
      - tools/repair_editor_images.py
      - .github/workflows/repair_editor_images.yml

permissions:
  contents: write

concurrency:
  group: edgeai-editor-image-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out EdgeAI
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Patch editor image handling
        run: python tools/repair_editor_images.py

      - name: Syntax check editor
        run: python -m py_compile edgeai_editor.py

      - name: Commit repaired editor
        shell: bash
        run: |
          if git diff --quiet -- edgeai_editor.py; then
            echo "Editor image handling already repaired."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add edgeai_editor.py
          git commit -m "[visual-backfill] editor: reject placeholder images and force refresh"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push attempt $attempt failed; retrying."
            sleep $((attempt * 2))
          done
          exit 1
